<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude RPC Settings</title>
<style>
  :root {
    --bg: #1a1a18; --panel: #262624; --line: #3a3935; --text: #ece9e1; --muted: #9c998f;
    --accent: #d97757; --discord: #2b2d31; --discord-card: #111214;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 32px 16px 64px; display: grid; gap: 24px; grid-template-columns: 1fr 320px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; }
  header img { width: 44px; height: 44px; }
  h1 { font-size: 20px; margin: 0; }
  #status { color: var(--muted); font-size: 13px; }
  #status::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  #status.ok::before { background: #3ba55d; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  h2:not(:first-child) { margin-top: 24px; }
  label.field { display: block; margin-bottom: 14px; }
  label.field span { display: block; margin-bottom: 4px; }
  small { color: var(--muted); display: block; margin-top: 4px; }
  input[type=text], input[type=number], select {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font: inherit;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .toggle { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .toggle:first-of-type { border-top: 0; }
  .toggle input { appearance: none; width: 36px; height: 20px; background: var(--line); border-radius: 10px; position: relative; cursor: pointer; transition: background .15s; flex: none; }
  .toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .toggle input:checked { background: var(--accent); }
  .toggle input:checked::after { transform: translateX(16px); }
  a { color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #saved { color: var(--muted); font-size: 13px; height: 20px; }
  aside { position: sticky; top: 24px; align-self: start; }
  .card { background: var(--discord-card); border-radius: 8px; padding: 12px; color: #dbdee1; }
  .card .label { font-size: 12px; font-weight: 700; margin-bottom: 8px; }
  .card .body { display: flex; gap: 12px; align-items: center; }
  .card img { width: 64px; height: 64px; border-radius: 8px; flex: none; background: var(--discord); }
  .card .lines { min-width: 0; font-size: 13px; }
  .card .lines div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .name { font-weight: 600; color: #f2f3f5; }
  .card .timer { color: #3ba55d; }
  .card button { margin-top: 10px; width: 100%; background: #4e5058; color: #fff; border: 0; border-radius: 4px; padding: 6px; font: inherit; }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <img src="data:," id="logo" alt="">
    <div>
      <h1>Claude RPC</h1>
      <div id="status">Connecting…</div>
    </div>
  </header>

  <form id="form">
    <section>
      <h2>Discord</h2>
      <label class="field"><span>Application ID</span>
        <input type="text" name="client_id" inputmode="numeric" placeholder="123456789012345678">
        <small>Create an app named <b>Claude Code</b> at <a href="https://discord.com/developers/applications" target="_blank">discord.com/developers</a> and paste its Application ID. The app name is what shows after "Playing".</small>
      </label>
      <label class="toggle">Show presence <input type="checkbox" name="enabled"></label>
      <label class="toggle">Start with Windows <input type="checkbox" name="start_with_windows"></label>

      <h2>What to show</h2>
      <label class="toggle">AI model <input type="checkbox" name="show_model"></label>
      <label class="toggle">Chat <input type="checkbox" name="show_chat"></label>
      <label class="toggle">Project folder <input type="checkbox" name="show_project"></label>
      <label class="toggle">Elapsed time <input type="checkbox" name="show_timer"></label>
      <label class="field" style="margin-top:12px"><span>Chat shows</span>
        <select name="chat_source">
          <option value="title">Session title</option>
          <option value="prompt">Your latest message</option>
        </select>
      </label>
      <label class="field"><span>Go idle after (minutes)</span>
        <input type="number" name="idle_minutes" min="1" max="1440">
        <small>Presence clears when no Claude Code session has been active for this long.</small>
      </label>

      <h2>Appearance</h2>
      <label class="field"><span>Image (URL or asset key)</span>
        <input type="text" name="large_image">
      </label>
      <label class="field"><span>Image hover text</span>
        <input type="text" name="large_text">
      </label>
      <div class="row">
        <label class="field"><span>Button label</span><input type="text" name="button_label" maxlength="32" placeholder="Optional"></label>
        <label class="field"><span>Button URL</span><input type="text" name="button_url" placeholder="https://"></label>
      </div>
      <div id="saved"></div>
    </section>
  </form>

  <aside>
    <section>
      <h2>Live preview</h2>
      <div id="preview"></div>
    </section>
  </aside>
</main>
<script>
const form = document.getElementById('form');
const $ = (n) => form.elements[n];
let saveTimer, startEpoch = null;

async function load() {
  const cfg = await (await fetch('/api/config')).json();
  for (const [k, v] of Object.entries(cfg)) {
    const el = $(k); if (!el) continue;
    el.type === 'checkbox' ? (el.checked = v) : (el.value = v);
  }
  document.getElementById('logo').src = cfg.large_image;
}

function collect() {
  const out = {};
  for (const el of form.elements) {
    if (!el.name) continue;
    out[el.name] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) || 10 : el.value.trim();
  }
  return out;
}

form.addEventListener('input', () => {
  clearTimeout(saveTimer);
  document.getElementById('saved').textContent = 'Saving…';
  saveTimer = setTimeout(async () => {
    const r = await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(collect()) });
    document.getElementById('saved').textContent = r.ok ? 'Saved' : 'Could not save';
    setTimeout(refresh, 600);
  }, 400);
});

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function elapsed() {
  if (!startEpoch) return '';
  let s = Math.max(0, Math.floor(Date.now() / 1000 - startEpoch));
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60; s %= 60;
  const p = (n) => String(n).padStart(2, '0');
  return (h ? h + ':' + p(m) : m) + ':' + p(s) + ' elapsed';
}

async function refresh() {
  try {
    const { status, activity } = await (await fetch('/api/status')).json();
    const st = document.getElementById('status');
    st.textContent = status; st.className = activity ? 'ok' : '';
    const pv = document.getElementById('preview');
    if (!activity) { startEpoch = null; pv.innerHTML = '<div class="empty">Nothing is being shown right now.</div>'; return; }
    startEpoch = activity.timestamps?.start ?? null;
    pv.innerHTML = `<div class="card"><div class="label">Playing</div><div class="body">
      <img src="${esc(activity.assets.large_image)}" alt="">
      <div class="lines"><div class="name">Claude Code</div><div>${esc(activity.details)}</div>
      ${activity.state ? `<div>${esc(activity.state)}</div>` : ''}<div class="timer" id="timer">${elapsed()}</div></div></div>
      ${(activity.buttons || []).map(b => `<button type="button">${esc(b.label)}</button>`).join('')}</div>`;
  } catch { document.getElementById('status').textContent = 'Claude RPC is not running'; }
}

setInterval(() => { const t = document.getElementById('timer'); if (t) t.textContent = elapsed(); }, 1000);
setInterval(refresh, 5000);
load().then(refresh);
</script>
</body>
</html>
